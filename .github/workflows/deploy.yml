name: build & deploy

# Сборка в CI, не на боксе (G20: `next build` на маленьком VPS = OOM).
# Для static export это особенно дёшево: на сервер уезжает готовый каталог.
#
# ⚠️ Репозиторий публичный. Ни одного инфраструктурного значения в открытом виде:
# хост, пользователь, порт и путь берутся ТОЛЬКО из секретов (#008). Ключ деплоя —
# отдельная пара, выданная только под этот репозиторий (#001): личный ключ владельца
# в CI не уезжает, отзыв деплой-ключа не задевает остальные доступы.
#
# Доставка — tar-потоком по ssh, а не rsync: rsync на целевом боксе не установлен,
# и ставить лишний пакет на прод ради деплоя статики незачем.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # G12: metadata-роуты обязаны реально сгенериться. Проверяем файлами, а не глазами.
      - name: Проверить полноту экспорта
        run: |
          set -e
          for f in out/index.html out/robots.txt out/sitemap.xml out/llms.txt out/facts.json \
                   out/raboty/index.html out/zadachi/index.html out/kontakty/index.html; do
            test -s "$f" || { echo "::error::нет или пуст $f"; exit 1; }
          done
          grep -q 'xn--80adkmnnb2b' out/sitemap.xml || { echo "::error::sitemap не в punycode"; exit 1; }
          # Юникод-хост в абсолютной ссылке ломает сниппет при шаринге (G133/G134)
          if grep -rlP 'https?://[^"'"'"' ]*[^\x00-\x7F]' out --include='*.html' | head -1 | grep -q .; then
            echo "::error::в разметке есть абсолютный URL с юникод-хостом"; exit 1
          fi
          echo "экспорт полон: $(find out -name '*.html' | wc -l) html-страниц"

      - name: Упаковать
        run: tar czf ../site.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Настроить ключ деплоя
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Залить статику и переключить релиз
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          REL="release-$(date -u +%Y%m%d%H%M%S)"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -p $SSH_PORT $SSH_USER@$SSH_HOST"
          # Распаковка на той стороне: новый релиз собирается целиком рядом с текущим
          $SSH "mkdir -p '$TARGET/releases/$REL'"
          $SSH "tar xzf - -C '$TARGET/releases/$REL'" < site.tar.gz
          # Переключение атомарное: mv -T подменяет симлинк одним шагом, без «мигания» 404
          $SSH "test -s '$TARGET/releases/$REL/index.html' \
            && ln -sfn '$TARGET/releases/$REL' '$TARGET/current.tmp' \
            && mv -T '$TARGET/current.tmp' '$TARGET/current' \
            && ls -1dt '$TARGET'/releases/release-* | tail -n +4 | xargs -r rm -rf \
            && echo 'релиз $REL активен'"

      # #011: смоук грепает МАРКЕР В ТЕЛЕ ответа — у статики 200 отдаёт и пустой индекс.
      - name: Смоук-проверка прода
        env:
          SITE: ${{ secrets.SITE_URL }}
        run: |
          set -e
          body=$(curl -fsSL --max-time 25 "$SITE/")
          echo "$body" | grep -q 'Савиных' || { echo "::error::главная без подписи автора"; exit 1; }
          echo "$body" | grep -q 'application/ld+json' || { echo "::error::главная без JSON-LD"; exit 1; }
          curl -fsSL --max-time 25 "$SITE/robots.txt" | grep -q 'Sitemap' || { echo "::error::robots.txt пуст"; exit 1; }
          # Кириллица в llms.txt ломается, если nginx отдаёт text/plain без charset
          curl -fsSL --max-time 25 "$SITE/llms.txt" | grep -q 'Классы задач' || { echo "::error::llms.txt пуст или в неверной кодировке"; exit 1; }
          curl -fsSL --max-time 25 "$SITE/raboty/" | grep -q 'Работы' || { echo "::error::каталог работ пуст"; exit 1; }
          curl -fsSL --max-time 25 "$SITE/zadachi/" | grep -q 'задачей' || { echo "::error::раздел задач пуст"; exit 1; }
          echo "смоук пройден"
