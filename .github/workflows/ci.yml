name: CI

# PR-гейт: до 2026-08-22 защита `main` стояла, а за ней было пусто — ни одного
# workflow на `pull_request`, любой PR вливался без единой проверки (директивы
# brain 2026-08-17 и 2026-08-22, решение владельца D-030).
#
# Гейт повторяет сборку деплоя (`deploy.yml`), а не «что-нибудь быстрое»: у нас
# static export и живой прод, поэтому единственное содержательное доказательство
# годности PR — что он собирается и экспортирует все маршруты.
#
# Имя job'а — `gates`; оно уходит в brain как имя обязательной проверки. Менять
# его нельзя, не предупредив письмом: несуществующее имя в required checks не
# «не срабатывает», а навсегда блокирует влитие — GitHub вечно ждёт отчёта,
# которого никто не пришлёт.

# Версии actions держим на node24: раннеры с 19.09.2025 ругаются на Node 20 и уже
# принудительно исполняют такие действия на Node 24 — предупреждение висело в каждом
# прогоне. Подняты 14.09 до текущих мажоров, ломающие изменения каждого сверены:
#   checkout v7 — блокирует checkout форка для `pull_request_target`/`workflow_run`;
#     у нас `pull_request`, не задевает;
#   setup-node v7 — в v6 урезали АВТОМАТИЧЕСКОЕ кеширование; у нас `cache: pnpm`
#     задан явно, а явный вход поддерживается по-прежнему;
#   upload-artifact v7 — «прямая загрузка» без zip включается `archive: false`,
#     по умолчанию всё как было;
#   download-artifact v8 — понимает и zip, и прямые (смотрит Content-Type), поэтому
#     пара v7+v8 сходится; несовместимость по мажорам была только между v3 и v4;
#   pnpm/action-setup v6 — добавил поддержку pnpm 11, мы пиним `version: 10`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история обязательна: без неё gitleaks смотрит один коммит и
          # гейт зелен ровно в том сценарии, ради которого ставится, — секрет,
          # добавленный и убранный соседними коммитами, остаётся в истории и
          # утёкшим быть не перестаёт.
          fetch-depth: 0

      # Репозиторий публичный с 2026-08-17: утёкший секрет скомпрометирован с
      # секунды пуша — форки, зеркала и кэши уже не отозвать, «удалить коммит»
      # не лечит (#060: ротация доминирует переписывание истории).
      #
      # Версия пришпилена: плавающий сканер меняет набор правил сам по себе.
      # `--redact` обязателен — иначе найденный секрет печатается в лог CI и
      # утекает второй раз, ровно тем шагом, который его ищет.
      # `--exit-code 1` — чтобы находка красила гейт, а не оставалась записью в логе.
      - name: Сканер секретов (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # Node 24: тот же мажор, на котором проект собирается на машине разработки.
          # Расхождение CI с локальной машиной — самостоятельный риск: грабля 1 этого
          # handoff (Next 15.5.4 не собирал static export на Windows) нашлась ровно на
          # таком расхождении. 24 — активная LTS, actions с 19.09.2025 уже на ней.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Установить зависимости
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      # ESLint в проекте не настроен осознанно — шага линта здесь нет намеренно,
      # а не по забывчивости: `pnpm lint` без конфига даёт зелёный ноль и был бы
      # ровно тем «гейтом без правила», против которого заведён этот файл (#104).
      - name: Сборка (static export)
        working-directory: web
        run: pnpm build

      - name: Проверить полноту экспорта
        working-directory: web
        run: bash ../scripts/check-export.sh out
