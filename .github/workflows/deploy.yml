name: build & deploy

# Сборка в CI, не на боксе (G20: `next build` на маленьком VPS = OOM).
# Для static export это особенно дёшево: на сервер уезжает готовый каталог.
#
# ⚠️ Репозиторий публичный. Ни одного инфраструктурного значения в открытом виде:
# хост, пользователь, порт и путь берутся ТОЛЬКО из секретов (#008). Ключ деплоя —
# отдельная пара, выданная только под этот репозиторий (#001): личный ключ владельца
# в CI не уезжает, отзыв деплой-ключа не задевает остальные доступы.
#
# Доставка — tar-потоком по ssh, а не rsync: rsync на целевом боксе не установлен,
# и ставить лишний пакет на прод ради деплоя статики незачем.

# Версии actions держим на node24: раннеры с 19.09.2025 ругаются на Node 20 и уже
# принудительно исполняют такие действия на Node 24 — предупреждение висело в каждом
# прогоне. Подняты 14.09 до текущих мажоров, ломающие изменения каждого сверены:
#   checkout v7 — блокирует checkout форка для `pull_request_target`/`workflow_run`;
#     у нас `pull_request`, не задевает;
#   setup-node v7 — в v6 урезали АВТОМАТИЧЕСКОЕ кеширование; у нас `cache: pnpm`
#     задан явно, а явный вход поддерживается по-прежнему;
#   upload-artifact v7 — «прямая загрузка» без zip включается `archive: false`,
#     по умолчанию всё как было;
#   download-artifact v8 — понимает и zip, и прямые (смотрит Content-Type), поэтому
#     пара v7+v8 сходится; несовместимость по мажорам была только между v3 и v4;
#   pnpm/action-setup v6 — добавил поддержку pnpm 11, мы пиним `version: 10`.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/check-export.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # Node 24: тот же мажор, на котором проект собирается на машине разработки.
          # Расхождение CI с локальной машиной — самостоятельный риск: грабля 1 этого
          # handoff (Next 15.5.4 не собирал static export на Windows) нашлась ровно на
          # таком расхождении. 24 — активная LTS, actions с 19.09.2025 уже на ней.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # G12: metadata-роуты обязаны реально сгенериться. Проверяем файлами, а не глазами.
      # Текст проверки общий с PR-гейтом (`ci.yml`) — чтобы гейт и деплой не разошлись.
      - name: Проверить полноту экспорта
        run: bash ../scripts/check-export.sh out

      - name: Упаковать
        run: tar czf ../site.tar.gz -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site

      - name: Настроить ключ деплоя
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Залить статику и переключить релиз
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          REL="release-$(date -u +%Y%m%d%H%M%S)"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -p $SSH_PORT $SSH_USER@$SSH_HOST"
          # Распаковка на той стороне: новый релиз собирается целиком рядом с текущим
          $SSH "mkdir -p '$TARGET/releases/$REL'"
          $SSH "tar xzf - -C '$TARGET/releases/$REL'" < site.tar.gz
          # Переключение атомарное: mv -T подменяет симлинк одним шагом, без «мигания» 404
          $SSH "test -s '$TARGET/releases/$REL/index.html' \
            && ln -sfn '$TARGET/releases/$REL' '$TARGET/current.tmp' \
            && mv -T '$TARGET/current.tmp' '$TARGET/current' \
            && ls -1dt '$TARGET'/releases/release-* | tail -n +4 | xargs -r rm -rf \
            && echo 'релиз $REL активен'"

      # #011: смоук грепает МАРКЕР В ТЕЛЕ ответа — у статики 200 отдаёт и пустой индекс.
      #
      # Проверяем НА БОКСЕ, через nginx с нужным Host-заголовком. Это и есть настоящий
      # предмет проверки: переключился ли симлинк, отдаёт ли nginx новый релиз, не потерялась
      # ли кодировка. Внешняя проверка отсюда ненадёжна — раннеры GitHub стоят вне России
      # и до хоста доходят через раз (первый же прогон упал по таймауту при живом сайте).
      - name: Смоук-проверка на боксе
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SITE_HOST: xn--80adkmnnb2b.xn--80adkdyec4j.xn--p1ai
        run: |
          set -e
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -p $SSH_PORT $SSH_USER@$SSH_HOST"
          get() { $SSH "curl -fsS --max-time 15 -H 'Host: $SITE_HOST' http://127.0.0.1$1"; }
          need() { echo "$1" | grep -q "$2" || { echo "::error::$3"; exit 1; }; }

          home=$(get /)
          need "$home" 'Савиных'            'главная без подписи автора'
          need "$home" 'application/ld+json' 'главная без JSON-LD'
          need "$(get /robots.txt)" 'Sitemap' 'robots.txt пуст'
          need "$(get /raboty/)"    'Работы'  'каталог работ пуст'
          need "$(get /zadachi/)"   'задачей' 'раздел задач пуст'

          # Кириллица в llms.txt ломается, если nginx отдаёт text/plain без charset —
          # проверяем и содержимое, и сам заголовок: файл может быть корректным, а отдача нет.
          need "$(get /llms.txt)" 'Классы задач' 'llms.txt пуст'
          ct=$($SSH "curl -fsSI --max-time 15 -H 'Host: $SITE_HOST' http://127.0.0.1/llms.txt" | tr -d '\r' | grep -i '^content-type:')
          need "$ct" 'charset=utf-8' "llms.txt отдаётся без charset=utf-8 ($ct) — кириллица у ИИ-ботов превратится в кашу"

          echo "смоук на боксе пройден"

      # Внешняя проверка — как есть: подтверждает сквозной путь через edge хостинга,
      # но не валит сборку, если раннер просто не дотянулся до России.
      - name: Внешняя проверка (не блокирующая)
        continue-on-error: true
        env:
          SITE: ${{ secrets.SITE_URL }}
        run: |
          if body=$(curl -fsSL --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors "$SITE/"); then
            echo "$body" | grep -q 'Савиных' \
              && echo "снаружи сайт отвечает и содержит подпись" \
              || echo "::warning::снаружи ответ получен, но подписи в нём нет"
          else
            echo "::warning::снаружи достучаться не удалось (маршрут раннера до РФ), смоук на боксе пройден"
          fi
